<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的英文學習 App</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#17181d;--muted:#777985;--line:#e5e6ec;--purple:#6262df;--good:#21875d;--bad:#ce4242}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
main{max-width:900px;margin:auto;padding:20px 16px 50px}
h1{margin:0 0 5px;font-size:28px}.muted{color:var(--muted)}
.row,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}
.row{margin:18px 0}
button,select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text)}
button,select{padding:10px 14px;min-height:44px}button.primary,.active{background:var(--purple);color:#fff;border-color:var(--purple)}
button.danger{color:var(--bad)}button.good{color:var(--good)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px}
.stat{padding:14px}.stat small{color:var(--muted);display:block}.stat b{font-size:24px}
.tabs{margin:16px 0;position:sticky;top:0;padding:8px 0;background:var(--bg);z-index:5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.panel{padding:17px}
.word{font-size:27px;font-weight:800}.pos,.extra{color:var(--muted);margin-top:5px}.zh{font-size:18px;margin-top:8px}
.hidden{display:none!important}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;padding:12px;font-size:16px}.form textarea{min-height:90px}
.big{font-size:36px;font-weight:800;margin:10px 0}
.options{display:grid;gap:8px;margin-top:14px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<h1>我的英文學習 App</h1>
<div class="muted">單字＋文法一起學習、朗讀、編輯、刪除與測驗。</div>

<div class="row">
<button id="vocabMode" class="active">📚 單字</button>
<button id="grammarMode">📖 文法</button>
<select id="accent">
<option value="en-GB">🇬🇧 英國腔</option>
<option value="en-US">🇺🇸 美國腔</option>
</select>
</div>

<section class="stats">
<div class="stat"><small>總數</small><b id="total">0</b></div>
<div class="stat"><small>已熟悉</small><b id="known">0</b></div>
<div class="stat"><small>收藏</small><b id="fav">0</b></div>
<div class="stat"><small>錯題</small><b id="wrong">0</b></div>
</section>

<nav class="tabs">
<button data-page="cards" class="tab active">📚 學習卡</button>
<button data-page="add" class="tab">＋ 新增</button>
<button data-page="quiz" class="tab">📝 測驗</button>
<button data-page="wrongPage" class="tab">❌ 錯題</button>
<button data-page="favPage" class="tab">⭐ 收藏</button>
</nav>

<section id="cards" class="page">
<div class="row">
<button id="readAll">▶ 全部朗讀</button>
<button id="stop">■ 停止</button>
</div>
<div id="cardList" class="grid"></div>
</section>

<section id="add" class="page hidden">
<div class="panel">
<h2 id="formTitle">新增單字</h2>

<form id="vForm" class="form">
<input id="ven" placeholder="英文" required>
<input id="vpos" placeholder="詞性，例如：動詞" required>
<input id="vzh" placeholder="中文意思" required>
<textarea id="vextra" placeholder="補充、例句、其他意思"></textarea>
<div class="actions">
<button class="primary" type="submit">💾 儲存</button>
<button id="cancelV" type="button" class="hidden">取消編輯</button>
</div>
</form>

<form id="gForm" class="form hidden">
<input id="gtitle" placeholder="文法名稱，例如：連綴動詞 Linking Verb" required>
<textarea id="gzh" placeholder="中文解釋" required></textarea>
<textarea id="gen" placeholder="英文解釋" required></textarea>
<textarea id="genzh" placeholder="英文解釋的中文翻譯" required></textarea>
<textarea id="gextra" placeholder="例句／補充"></textarea>
<div class="actions">
<button class="primary" type="submit">💾 儲存</button>
<button id="cancelG" type="button" class="hidden">取消編輯</button>
</div>
</form>
</div>
</section>

<section id="quiz" class="page hidden">
<div class="panel">
<div id="quizPrompt" class="muted"></div>
<div id="quizQuestion" class="big"></div>
<button id="quizSpeak">🔊 聽發音</button>
<div id="options" class="options"></div>
<div id="feedback" style="margin-top:12px;font-weight:700"></div>
<div class="actions" style="margin-top:12px">
<button id="check" class="primary" disabled>✅ 檢查答案</button>
<button id="next">下一題</button>
</div>
</div>
</section>

<section id="wrongPage" class="page hidden"><div id="wrongList" class="grid"></div></section>
<section id="favPage" class="page hidden"><div id="favList" class="grid"></div></section>
</main>

<script>
const defaultsV=[
{id:"v1",en:"complains",pos:"動詞",zh:"抱怨",extra:"complain 的第三人稱單數"},
{id:"v2",en:"made",pos:"動詞／形容詞",zh:"製造了、使……成為；做成的、製成的",extra:"make 的過去式／過去分詞"},
{id:"v3",en:"supervises",pos:"動詞",zh:"監督、管理",extra:"supervise 的第三人稱單數"},
{id:"v4",en:"responsible",pos:"形容詞",zh:"負責任的；需負責的",extra:"be responsible for = 對……負責"},
{id:"v5",en:"become",pos:"動詞",zh:"變成、成為",extra:"常作連綴動詞"},
{id:"v6",en:"stays",pos:"動詞／名詞",zh:"保持、停留；逗留、住宿",extra:"stay calm = 保持冷靜"},
{id:"v7",en:"calm",pos:"形容詞／動詞／名詞",zh:"平靜的；使平靜；平靜",extra:"calm down = 冷靜下來"},
{id:"v8",en:"seems",pos:"動詞",zh:"似乎、看起來",extra:"seem 的第三人稱單數"},
{id:"v9",en:"stressed",pos:"形容詞",zh:"有壓力的、焦慮的",extra:"feel stressed"},
{id:"v10",en:"crises",pos:"名詞",zh:"危機（複數）",extra:"單數 crisis"},
{id:"v11",en:"occur",pos:"不及物動詞",zh:"發生、出現",extra:"occur to someone = 某人突然想到"},
{id:"v12",en:"figures",pos:"名詞／動詞",zh:"數字、數據；人物；圖形；認為、計算",extra:"figure out = 弄懂、算出"},
{id:"v13",en:"quarter",pos:"名詞／動詞",zh:"季度；四分之一；地區；提供住宿",extra:"a quarter = 四分之一"},
{id:"v14",en:"capable",pos:"形容詞",zh:"有能力的、有才幹的",extra:"be capable of + V-ing"},
{id:"v15",en:"employee",pos:"名詞",zh:"員工、雇員",extra:"employer = 雇主"},
{id:"v16",en:"excellent",pos:"形容詞",zh:"傑出的、優秀的、極好的",extra:"excellent work"}
];

const defaultsG=[
{id:"g1",title:"可數名詞 Countable Nouns",zh:"可以一個、兩個、三個地數的名詞。",en:"Countable nouns can be counted.",enZh:"可數名詞是可以被數出數量的名詞。",extra:"a book → two books"},
{id:"g2",title:"名詞 Noun",zh:"表示人、事物、地點或概念，常可以當主詞或受詞。",en:"A noun names a person, thing, place, or idea.",enZh:"名詞表示人、事物、地點或概念。",extra:"employee、crisis、quarter"},
{id:"g3",title:"動詞 Verb",zh:"表示動作、事件或狀態。",en:"A verb expresses an action, event, or state.",enZh:"動詞表示動作、事件或狀態。",extra:"complain、supervise、occur"},
{id:"g4",title:"及物動詞 Transitive Verb",zh:"後面需要直接受詞。",en:"A transitive verb takes a direct object.",enZh:"及物動詞後面接受詞。",extra:"She supervises the employees."},
{id:"g5",title:"不及物動詞 Intransitive Verb",zh:"後面不直接接受詞。",en:"An intransitive verb does not take a direct object.",enZh:"不及物動詞不直接接受詞。",extra:"The accident occurred."},
{id:"g6",title:"連綴動詞 Linking Verb",zh:"把主詞和後面的主詞補語連接起來。",en:"A linking verb connects the subject to a subject complement.",enZh:"連綴動詞連接主詞與主詞補語。",extra:"be、seem、become、stay"},
{id:"g7",title:"主詞補語 Subject Complement",zh:"補充說明主詞的身分或狀態。",en:"A subject complement describes or identifies the subject.",enZh:"主詞補語描述或辨認主詞。",extra:"She is beautiful."},
{id:"g8",title:"形容詞 Adjective",zh:"修飾名詞，或描述主詞。",en:"An adjective describes a noun or subject.",enZh:"形容詞用來描述名詞或主詞。",extra:"an excellent employee"},
{id:"g9",title:"代名詞 Pronoun",zh:"代替名詞，避免一直重複。",en:"A pronoun replaces a noun.",enZh:"代名詞用來代替名詞。",extra:"Tom is my friend. He is nice."}
];

const load=(k,d)=>{
 try{
  const x=JSON.parse(localStorage.getItem(k));
  return Array.isArray(x)&&x.length?x:d;
 }catch{return d}
};

let vocab=load("englishVocab",defaultsV);
let grammar=load("englishGrammar",defaultsG);
let mode="vocab";
let editId=null;

const setLoad=k=>{
 try{return new Set(JSON.parse(localStorage.getItem(k)||"[]"))}
 catch{return new Set()}
};

let vf=setLoad("vf"),vk=setLoad("vk"),vw=setLoad("vw");
let gf=setLoad("gf"),gk=setLoad("gk"),gw=setLoad("gw");

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function save(){
 try{
 localStorage.setItem("englishVocab",JSON.stringify(vocab));
 localStorage.setItem("englishGrammar",JSON.stringify(grammar));
 localStorage.setItem("vf",JSON.stringify([...vf]));
 localStorage.setItem("vk",JSON.stringify([...vk]));
 localStorage.setItem("vw",JSON.stringify([...vw]));
 localStorage.setItem("gf",JSON.stringify([...gf]));
 localStorage.setItem("gk",JSON.stringify([...gk]));
 localStorage.setItem("gw",JSON.stringify([...gw]));
 }catch{}
}

function items(){return mode==="vocab"?vocab:grammar}
function favs(){return mode==="vocab"?vf:gf}
function knowns(){return mode==="vocab"?vk:gk}
function wrongs(){return mode==="vocab"?vw:gw}

function speak(text,lang){
 if(!("speechSynthesis" in window))return;
 const u=new SpeechSynthesisUtterance(text);
 u.lang=lang;
 speechSynthesis.speak(u);
}

function speakItem(i){
 speechSynthesis.cancel();
 if(mode==="vocab"){
  speak(i.en,$("#accent").value);
 }else{
  speak(i.title,$("#accent").value);
  setTimeout(()=>speak(i.zh,"zh-TW"),900);
  setTimeout(()=>speak(i.en,$("#accent").value),2200);
 }
}

function card(i){
 const title=mode==="vocab"?i.en:i.title;
 const second=mode==="vocab"?`<div class="pos">${esc(i.pos)}</div>`:"";
 const en=mode==="grammar"?`<div class="extra"><b>English：</b>${esc(i.en)}</div><div class="extra"><b>中文翻譯：</b>${esc(i.enZh)}</div>`:"";
 return `<article class="card">
 <div class="word">${esc(title)}</div>
 ${second}
 <div class="zh">${esc(i.zh)}</div>
 ${en}
 <div class="extra">${esc(i.extra||"")}</div>
 <div class="actions" style="margin-top:13px">
 <button onclick="listen('${i.id}')">🔊 朗讀</button>
 <button onclick="favorite('${i.id}')">${favs().has(i.id)?"★ 已收藏":"☆ 收藏"}</button>
 <button class="${knowns().has(i.id)?"good":""}" onclick="know('${i.id}')">${knowns().has(i.id)?"✓ 已熟悉":"○ 還在學"}</button>
 <button onclick="edit('${i.id}')">✏️ 編輯</button>
 <button class="danger" onclick="removeItem('${i.id}')">🗑 刪除</button>
 </div></article>`;
}

function render(){
 $("#total").textContent=items().length;
 $("#known").textContent=knowns().size;
 $("#fav").textContent=favs().size;
 $("#wrong").textContent=wrongs().size;
 $("#cardList").innerHTML=items().length?items().map(card).join(""):"<div class='panel'>目前沒有內容。</div>";
 $("#favList").innerHTML=items().filter(x=>favs().has(x.id)).map(card).join("")||"<div class='panel'>目前沒有收藏。</div>";
 $("#wrongList").innerHTML=items().filter(x=>wrongs().has(x.id)).map(card).join("")||"<div class='panel'>目前沒有錯題。</div>";
}

window.listen=id=>{const i=items().find(x=>x.id===id);if(i)speakItem(i)};
window.favorite=id=>{favs().has(id)?favs().delete(id):favs().add(id);save();render()};
window.know=id=>{knowns().has(id)?knowns().delete(id):knowns().add(id);save();render()};

window.removeItem=id=>{
 const i=items().find(x=>x.id===id);
 if(!i)return;
 const name=mode==="vocab"?i.en:i.title;
 if(!confirm(`確定要刪除「${name}」嗎？`))return;
 if(mode==="vocab")vocab=vocab.filter(x=>x.id!==id);
 else grammar=grammar.filter(x=>x.id!==id);
 favs().delete(id);knowns().delete(id);wrongs().delete(id);
 save();render();
};

window.edit=id=>{
 const i=items().find(x=>x.id===id);if(!i)return;
 editId=id;
 if(mode==="vocab"){
  $("#ven").value=i.en;$("#vpos").value=i.pos;$("#vzh").value=i.zh;$("#vextra").value=i.extra||"";
  $("#cancelV").classList.remove("hidden");
 }else{
  $("#gtitle").value=i.title;$("#gzh").value=i.zh;$("#gen").value=i.en;$("#genzh").value=i.enZh;$("#gextra").value=i.extra||"";
  $("#cancelG").classList.remove("hidden");
 }
 show("add");
};

$("#vForm").onsubmit=e=>{
 e.preventDefault();
 const d={en:$("#ven").value,pos:$("#vpos").value,zh:$("#vzh").value,extra:$("#vextra").value};
 if(editId){
  const n=vocab.findIndex(x=>x.id===editId);vocab[n]={...vocab[n],...d};
 }else vocab.unshift({id:"v"+Date.now(),...d});
 editId=null;e.target.reset();$("#cancelV").classList.add("hidden");save();render();show("cards");
};

$("#gForm").onsubmit=e=>{
 e.preventDefault();
 const d={title:$("#gtitle").value,zh:$("#gzh").value,en:$("#gen").value,enZh:$("#genzh").value,extra:$("#gextra").value};
 if(editId){
  const n=grammar.findIndex(x=>x.id===editId);grammar[n]={...grammar[n],...d};
 }else grammar.unshift({id:"g"+Date.now(),...d});
 editId=null;e.target.reset();$("#cancelG").classList.add("hidden");save();render();show("cards");
};

$("#cancelV").onclick=()=>{editId=null;$("#vForm").reset();$("#cancelV").classList.add("hidden");show("cards")};
$("#cancelG").onclick=()=>{editId=null;$("#gForm").reset();$("#cancelG").classList.add("hidden");show("cards")};

function setMode(m){
 mode=m;editId=null;
 $("#vocabMode").classList.toggle("active",m==="vocab");
 $("#grammarMode").classList.toggle("active",m==="grammar");
 $("#vForm").classList.toggle("hidden",m!=="vocab");
 $("#gForm").classList.toggle("hidden",m!=="grammar");
 $("#formTitle").textContent=m==="vocab"?"新增單字":"新增文法";
 render();show("cards");
}
$("#vocabMode").onclick=()=>setMode("vocab");
$("#grammarMode").onclick=()=>setMode("grammar");

function show(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
 $("#"+id).classList.remove("hidden");
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.page===id));
 if(id==="quiz")newQuiz();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.page));

let correctId=null,selectedId=null,checked=false;

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function newQuiz(){
 const a=items();
 if(a.length<2)return;
 const correct=a[Math.floor(Math.random()*a.length)];
 correctId=correct.id;selectedId=null;checked=false;
 $("#check").disabled=true;
 $("#feedback").textContent="";
 $("#quizPrompt").textContent=mode==="vocab"?"這個英文是什麼意思？":"這個文法名稱的中文重點是什麼？";
 $("#quizQuestion").textContent=mode==="vocab"?correct.en:correct.title;
 const opts=shuffle([correct,...shuffle(a.filter(x=>x.id!==correct.id)).slice(0,3)]);
 $("#options").innerHTML=opts.map(x=>`<button data-id="${x.id}">${esc(x.zh)}</button>`).join("");
 $("#options").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  if(checked)return;
  selectedId=b.dataset.id;
  $("#options").querySelectorAll("button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  $("#check").disabled=false;
 });
}

$("#check").onclick=()=>{
 if(!selectedId||checked)return;
 checked=true;
 const c=items().find(x=>x.id===correctId);
 if(selectedId===correctId){
  knowns().add(correctId);wrongs().delete(correctId);
  $("#feedback").textContent="✅ 答對了！";
 }else{
  wrongs().add(correctId);
  $("#feedback").textContent="❌ 答錯了。正確答案："+c.zh;
 }
 save();render();
};

$("#next").onclick=newQuiz;
$("#quizSpeak").onclick=()=>{const i=items().find(x=>x.id===correctId);if(i)speakItem(i)};

$("#readAll").onclick=()=>{
 speechSynthesis.cancel();
 items().forEach((i,n)=>setTimeout(()=>speakItem(i),n*1600));
};
$("#stop").onclick=()=>speechSynthesis.cancel();

render();
</script>
</body>
</html>
