<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英文學習">
<title>我的英文學習 App</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#17181d;--muted:#71737d;--line:#e7e8ee;--accent:#5b5bd6;--soft:#eeeeff;--good:#23875f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.app{max-width:920px;margin:auto;padding:18px 16px 36px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.hero h1{margin:0;font-size:28px}
.muted{color:var(--muted)}.small{font-size:13px}.accent-picker{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:14px}
button{font:inherit;min-height:44px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 13px}
.accent-btn{min-height:36px;padding:7px 10px;border:0}.accent-btn.active,button.primary,.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.stat,.card,.panel,.daily,.grammar-card{background:#fff;border:1px solid var(--line);border-radius:18px}
.stat{padding:12px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{font-size:22px}
.daily{padding:18px;margin-top:12px}.daily-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.daily-word{font-size:34px;font-weight:850;margin:6px 0}
.pos{font-size:14px;color:var(--muted)}.zh{font-size:18px;margin-top:7px}.extra{font-size:14px;color:var(--muted);line-height:1.55;margin-top:5px}
.tabs,.controls,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:14px 0 12px;position:sticky;top:0;z-index:5;background:rgba(246,247,251,.96);padding:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:16px}.word{font-size:26px;font-weight:850}.actions{margin-top:12px}
button.good{background:#eefaf4;color:var(--good)}.hidden{display:none!important}.panel{padding:18px}.big{font-size:38px;font-weight:850}
.section-title{font-size:20px;font-weight:850;margin:8px 0 12px}.grammar-list{display:grid;gap:12px}.grammar-card{padding:17px}.grammar-card h3{margin:0 0 8px;font-size:20px}
.grammar-card p{margin:6px 0;line-height:1.65}.formula{background:var(--soft);padding:10px 12px;border-radius:12px;margin-top:9px;font-weight:700}
.example{border-left:4px solid var(--accent);padding:8px 12px;margin-top:10px;background:#fafaff;border-radius:8px}.tag{display:inline-block;background:#f0f1f5;border-radius:999px;padding:4px 8px;font-size:12px;margin-right:5px}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:16px}.feedback{min-height:26px;font-weight:800;margin-top:10px}.add-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted);font-weight:700}.field input,.field textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--text)}.field textarea{min-height:82px;resize:vertical}.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.lookup-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}.lookup-card h4{margin:0 0 8px}.lookup-row{display:flex;gap:8px;align-items:flex-start;margin:7px 0}.lookup-row input{margin-top:4px}.lookup-meaning{min-width:0;line-height:1.5}.lookup-en{font-size:12px;color:var(--muted);margin-top:3px}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.daily-top{align-items:flex-start}.daily-word{font-size:30px}.hero{flex-direction:column}.accent-picker{align-self:flex-start}}
</style>
</head>
<body>
<main class="app">
<section class="hero">
  <div><h1>我的英文學習 App</h1><div class="muted">單字＋文法一起複習</div></div>
  <div class="accent-picker" aria-label="口音切換">
    <button id="ukBtn" class="accent-btn">🇬🇧 英國腔</button>
    <button id="usBtn" class="accent-btn">🇺🇸 美國腔</button>
  </div>
</section>

<section class="stats">
  <div class="stat"><span>總單字</span><b id="totalCount">0</b></div>
  <div class="stat"><span>已熟悉</span><b id="knownCount">0</b></div>
  <div class="stat"><span>收藏</span><b id="favCount">0</b></div>
  <div class="stat"><span>文法重點</span><b id="grammarCount">0</b></div>
</section>

<section class="daily">
  <div class="daily-top">
    <div><div class="small muted">今日單字</div><div id="dailyWord" class="daily-word"></div><div id="dailyPos" class="pos"></div><div id="dailyZh" class="zh"></div><div id="dailyExtra" class="extra"></div></div>
    <button id="dailySpeak" class="primary">🔊 聽發音</button>
  </div>
</section>

<nav class="tabs">
  <button class="tab active" data-tab="words">📚 單字</button>
  <button class="tab" data-tab="grammar">📖 文法</button>
  <button class="tab" data-tab="quiz">📝 測驗</button>
  <button class="tab" data-tab="favorites">⭐ 收藏</button>
</nav>

<section id="words" class="view">
  <div class="controls" style="margin-bottom:12px"><button id="addWordBtn" class="primary">＋ 新增單字</button><button id="playAll">▶ 全部朗讀</button><button id="stopAll">■ 停止</button><button id="importBtn">📥 匯入資料</button><button id="exportBtn">📤 備份資料</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div>
  <div id="wordForm" class="add-panel hidden">
    <div class="section-title">＋ 新增單字</div>
    <div class="form-grid">
      <div class="field"><label for="newEn">英文 *</label><input id="newEn" placeholder="例如: improve"></div>
      <div class="field"><label for="newPos">詞性</label><input id="newPos" placeholder="例如: 動詞 v."></div>
      <div class="field full"><label for="newZh">中文意思 *</label><input id="newZh" placeholder="例如: 改善、提升"></div>
      <div class="field full"><label for="newExtra">補充／其他意思</label><textarea id="newExtra" placeholder="例如: improve skills = 提升技能"></textarea></div>
    </div>
    <div class="form-actions">
      <button id="lookupWord">🔍 自動查單字</button>
      <button id="previewWord">🔊 試聽英文</button>
      <button id="checkWord">✅ 免費檢查</button>
      <button id="chatgptWord">🤖 給 ChatGPT 檢查</button>
      <button id="saveWord" class="primary">儲存單字</button>
      <button id="cancelWord">取消</button>
    </div>
    <div id="wordLookupStatus" class="feedback"></div>
    <div id="wordLookupResults" class="grammar-list"></div>
    <div id="wordCheckResult" class="feedback"></div>
  </div>
  <div id="wordList" class="grid"></div>
</section>

<section id="grammar" class="view hidden">
  <div class="controls" style="margin-bottom:12px"><button id="addGrammarBtn" class="primary">＋ 新增文法</button><button id="stopGrammar">■ 停止朗讀</button></div>
  <div id="grammarForm" class="add-panel hidden">
    <div class="section-title">＋ 新增文法</div>
    <div class="form-grid">
      <div class="field full"><label for="newGTitle">文法標題 *</label><input id="newGTitle" placeholder="例如: 現在完成式 Present Perfect"></div>
      <div class="field full"><label for="newGBody">中文解釋</label><textarea id="newGBody" placeholder="這個文法什麼時候使用？"></textarea></div>
      <div class="field full"><label for="newGFormula">公式</label><input id="newGFormula" placeholder="例如: have / has + p.p."></div>
      <div class="field full"><label for="newGExample">例句</label><textarea id="newGExample" placeholder="例如: I have finished my homework."></textarea></div>
    </div>
    <div class="form-actions">
      <button id="lookupGrammar">🔍 自動查文法</button>
      <button id="previewGrammar">🔊 試聽文法</button>
      <button id="checkGrammar">✅ 免費檢查</button>
      <button id="chatgptGrammar">🤖 給 ChatGPT 檢查</button>
      <button id="saveGrammar" class="primary">儲存文法</button>
      <button id="cancelGrammar">取消</button>
    </div>
    <div id="grammarLookupStatus" class="feedback"></div>
    <div id="grammarLookupResults" class="grammar-list"></div>
    <div id="grammarCheckResult" class="feedback"></div>
  </div>
  <div class="section-title">你的筆記：文法重點</div><div id="grammarList" class="grammar-list"></div>
</section>

<section id="quiz" class="view hidden">
  <div class="panel">
    <div class="muted">這個英文是什麼意思？</div><div id="quizWord" class="big"></div>
    <button id="quizSpeak">🔊 聽發音</button>
    <div id="quizOptions" style="display:grid;gap:8px;margin-top:14px"></div>
    <div id="quizFeedback" class="feedback"></div>
    <button id="nextQuiz" class="primary">下一題</button>
  </div>
</section>

<section id="favorites" class="view hidden"><div class="section-title">我的收藏</div><div id="favoritesList" class="grid"></div></section>
<div class="note">上方可隨時切換 🇬🇧 英國腔 / 🇺🇸 美國腔。可直接新增單字或文法，使用「✅ 免費檢查」先檢查格式，或按「🤖 給 ChatGPT 檢查」做更完整的語意與文法確認。單字與文法都可以新增、編輯、刪除；新增單字時可按「🔍 自動查單字」查詞性與常見意思；新增文法時可按「🔍 自動查文法」取得解釋、公式和多個例句。修改內容會保存在這台裝置的瀏覽器中，也可用「📤 備份資料」備份。</div>
</main>

<script>
const baseWords=[
{en:'complains',pos:'動詞 v.',zh:'抱怨',extra:'complain 的第三人稱單數；complain about = 抱怨……'},
{en:'made',pos:'動詞 v.／形容詞 adj.',zh:'製造了、做了；製成的',extra:'make 的過去式／過去分詞；made 也可表示「製成的」'},
{en:'supervises',pos:'動詞 v.',zh:'監督、管理',extra:'supervise 的第三人稱單數'},
{en:'responsible',pos:'形容詞 adj.',zh:'負責任的；需負責的',extra:'be responsible for = 對……負責'},
{en:'become',pos:'連綴動詞／不及物動詞',zh:'變成、成為',extra:'常接形容詞或名詞作主詞補語，例如 become tired'},
{en:'stays',pos:'動詞 v.',zh:'停留、保持、住宿',extra:'stay calm = 保持冷靜；stay 也可表示住宿'},
{en:'calm',pos:'形容詞 adj.／動詞 v.／名詞 n.',zh:'平靜的；使平靜；平靜',extra:'stay calm = 保持冷靜；calm down = 冷靜下來'},
{en:'seems',pos:'連綴動詞 v.',zh:'似乎、看起來',extra:'seem 的第三人稱單數；seem + adj.'},
{en:'stressed',pos:'形容詞 adj.',zh:'有壓力的、緊張的',extra:'feel stressed = 感到有壓力'},
{en:'crises',pos:'名詞 n.',zh:'危機（複數）',extra:'單數 crisis；複數 crises'},
{en:'occur',pos:'不及物動詞 v.',zh:'發生、出現',extra:'較正式，意思接近 happen'},
{en:'figures',pos:'名詞 n.／動詞 v.',zh:'數字、數據、人物；認為、計算',extra:'figure 的複數或第三人稱單數'},
{en:'quarter',pos:'名詞 n.／動詞 v.',zh:'季度、四分之一；把……分成四份',extra:'a quarter = 四分之一'},
{en:'capable',pos:'形容詞 adj.',zh:'有能力的、有本事的',extra:'be capable of + V-ing = 有能力做……'},
{en:'employee',pos:'名詞 n.',zh:'員工、受僱者',extra:'employer = 雇主；employment = 就業'},
{en:'excellent',pos:'形容詞 adj.',zh:'優秀的、極好的',extra:'excellent work = 優秀的工作表現'}
];

const baseGrammar=[
{title:'可數名詞 Countable Nouns',tags:['名詞 n.'],body:'可以數出一個、兩個、三個的名詞。可數名詞有單數和複數。',formula:'單數：a / an + 名詞｜複數：名詞 + s / es',example:'a book → two books；an employee → three employees'},
{title:'名詞 Noun',tags:['n.'],body:'名詞用來表示人、事物、地方或概念。',formula:'人／事物／地方／概念 = 名詞',example:'employee 員工、quarter 季度、crisis 危機'},
{title:'動詞 Verb',tags:['v.'],body:'動詞用來表示動作、發生的事情或狀態。',formula:'主詞 + 動詞',example:'Crises occur. = 危機發生。'},
{title:'受詞 Object',tags:['句子結構'],body:'受詞是接受動作的人或事物。通常放在及物動詞後面。',formula:'主詞 + 動詞 + 受詞',example:'She supervises employees. → employees 是受詞'},
{title:'及物動詞 Transitive Verb',tags:['及物 v.'],body:'及物動詞後面可以直接接受詞。',formula:'主詞 + 及物動詞 + 受詞',example:'She supervises employees.'},
{title:'不及物動詞 Intransitive Verb',tags:['不及物 v.'],body:'不及物動詞後面不能直接接受詞。',formula:'主詞 + 不及物動詞',example:'Crises occur. → occur 後面不需要受詞'},
{title:'連綴動詞 Linking Verb',tags:['連綴 v.'],body:'連綴動詞不是表示真正的動作，而是連接主詞和後面的補語。',formula:'主詞 + 連綴動詞 + 主詞補語',example:'She is beautiful.'},
{title:'主詞補語 Subject Complement',tags:['補語'],body:'主詞補語用來補充說明主詞是什麼或怎麼樣。',formula:'主詞 + 連綴動詞 + 主詞補語',example:'She is beautiful. → beautiful 描述 She'},
{title:'形容詞 Adjective',tags:['adj.'],body:'形容詞用來描述名詞，也可以放在連綴動詞後面描述主詞。',formula:'形容詞 + 名詞｜主詞 + 連綴動詞 + 形容詞',example:'an excellent employee；She is responsible.'},
{title:'代名詞 Pronoun',tags:['pron.'],body:'代名詞用來代替名詞，避免一直重複同一個人或事物。',formula:'名詞 → 代名詞',example:'Tom is my friend. He is nice. → He 代替 Tom'},
{title:'一般動詞 Action Verb',tags:['一般動詞'],body:'一般動詞通常表示實際動作或行為，例如工作、吃、跑、管理。',formula:'主詞 + 一般動詞',example:'She supervises employees.'}
];


let savedWords=JSON.parse(localStorage.getItem('allWords4')||'null');
let savedGrammar=JSON.parse(localStorage.getItem('allGrammar4')||'null');

let words=Array.isArray(savedWords)?savedWords:[...baseWords, ...JSON.parse(localStorage.getItem('customWords3')||'[]')];
let grammar=Array.isArray(savedGrammar)?savedGrammar:[...baseGrammar, ...JSON.parse(localStorage.getItem('customGrammar3')||'[]')];

function saveAllData(){
  localStorage.setItem('allWords4',JSON.stringify(words));
  localStorage.setItem('allGrammar4',JSON.stringify(grammar));
}

function saveCustomData(){
  saveAllData();
}

const $=s=>document.querySelector(s);
const loadSet=k=>new Set(JSON.parse(localStorage.getItem(k)||'[]'));
const state={
  known:loadSet('known3'),
  fav:loadSet('fav3'),
  accent:localStorage.getItem('accent3')||'en-GB'
};

function accentName(){return state.accent==='en-US'?'🇺🇸 美國腔':'🇬🇧 英國腔'}
function save(){localStorage.setItem('known3',JSON.stringify([...state.known]));localStorage.setItem('fav3',JSON.stringify([...state.fav]));localStorage.setItem('accent3',state.accent)}
function setAccent(accent){
  speechSynthesis.cancel();
  state.accent=accent;save();
  $('#ukBtn').classList.toggle('active',accent==='en-GB');
  $('#usBtn').classList.toggle('active',accent==='en-US');
  renderWords();renderFav();
  $('#quizSpeak').textContent='🔊 '+accentName();
}

function speak(text,lang=null,rate=.72){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window)){resolve();return}
    const actualLang=lang||state.accent;
    const u=new SpeechSynthesisUtterance(text);
    u.lang=actualLang;u.rate=rate;
    const voices=speechSynthesis.getVoices();
    const target=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(actualLang.toLowerCase()));
    if(target)u.voice=target;
    u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);
  });
}

async function speakFull(w){
  speechSynthesis.cancel();
  await speak(w.en,state.accent,.68);
  await speak(w.pos,'zh-TW',.9);
  await speak(w.zh,'zh-TW',.9);
}

function updateStats(){
  $('#totalCount').textContent=words.length;$('#knownCount').textContent=state.known.size;
  $('#favCount').textContent=state.fav.size;$('#grammarCount').textContent=grammar.length;
}

function wordCard(w,i){
  return `<article class="card">
  <button class="full" data-i="${i}" style="width:100%;text-align:left;border:0;padding:0;background:transparent">
  <div class="word">${w.en}</div><div class="pos">${w.pos}</div><div class="zh">${w.zh}</div><div class="extra">${w.extra}</div></button>
  <div class="actions"><button class="speak" data-i="${i}">🔊 ${accentName()}</button>
  <button class="fav" data-i="${i}">${state.fav.has(i)?'★ 已收藏':'☆ 收藏'}</button>
  <button class="known ${state.known.has(i)?'good':''}" data-i="${i}">${state.known.has(i)?'✓ 已熟悉':'○ 還在學'}</button></div></article>`;
}

function bind(box){
  box.querySelectorAll('.full').forEach(b=>b.onclick=()=>speakFull(words[+b.dataset.i]));
  box.querySelectorAll('.speak').forEach(b=>b.onclick=()=>{speechSynthesis.cancel();speak(words[+b.dataset.i].en,state.accent,.68)});
  box.querySelectorAll('.fav').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;state.fav.has(i)?state.fav.delete(i):state.fav.add(i);save();render()});
  box.querySelectorAll('.known').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;state.known.has(i)?state.known.delete(i):state.known.add(i);save();render()});
}
function renderWords(){const b=$('#wordList');b.innerHTML=words.map(wordCard).join('');bind(b)}
function renderFav(){const ids=[...state.fav],b=$('#favoritesList');b.innerHTML=ids.length?ids.map(i=>wordCard(words[i],i)).join(''):'<div class="panel muted">還沒有收藏單字。</div>';bind(b)}
async function speakMixed(text){
  const parts=String(text||'').match(/[A-Za-z][A-Za-z0-9'’.,!?/()+\- ]*|[^A-Za-z]+/g)||[];
  for(const part of parts){
    if(!part.trim()) continue;
    await speak(part,/[A-Za-z]/.test(part)?state.accent:'zh-TW',/[A-Za-z]/.test(part)?.7:.88);
  }
}
async function speakGrammarAll(g){
  speechSynthesis.cancel();
  await speakMixed(g.title);
  await speakMixed(g.body);
  await speakMixed(g.formula);
  await speakMixed(g.example);
}
function renderGrammar(){
  $('#grammarList').innerHTML=grammar.map((g,i)=>`<article class="grammar-card">
    <h3>${g.title}</h3>
    <div>${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <p>${g.body}</p>
    <div class="formula">${g.formula}</div>
    <div class="example"><b>例：</b>${g.example}</div>
    <div class="actions" style="margin-top:12px">
      <button class="g-title" data-i="${i}">🔊 標題</button>
      <button class="g-formula" data-i="${i}">🔊 公式</button>
      <button class="g-example" data-i="${i}">🔊 例句</button>
      <button class="g-all" data-i="${i}">▶ 全部朗讀</button>
    </div>
  </article>`).join('');
  $('#grammarList').querySelectorAll('.g-title').forEach(b=>b.onclick=()=>{speechSynthesis.cancel();speakMixed(grammar[+b.dataset.i].title)});
  $('#grammarList').querySelectorAll('.g-formula').forEach(b=>b.onclick=()=>{speechSynthesis.cancel();speakMixed(grammar[+b.dataset.i].formula)});
  $('#grammarList').querySelectorAll('.g-example').forEach(b=>b.onclick=()=>{speechSynthesis.cancel();speakMixed(grammar[+b.dataset.i].example)});
  $('#grammarList').querySelectorAll('.g-all').forEach(b=>b.onclick=()=>speakGrammarAll(grammar[+b.dataset.i]));
}
function daily(){const d=new Date(),i=(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())%words.length,w=words[i];$('#dailyWord').textContent=w.en;$('#dailyPos').textContent=w.pos;$('#dailyZh').textContent=w.zh;$('#dailyExtra').textContent=w.extra;$('#dailySpeak').onclick=()=>speakFull(w)}
function quiz(){
  const correct=Math.floor(Math.random()*words.length),w=words[correct];$('#quizWord').textContent=w.en;$('#quizFeedback').textContent='';
  $('#quizSpeak').textContent='🔊 '+accentName();

function copyTextFallback(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{document.execCommand('copy');}catch(e){}
  ta.remove();
}

async function copyAndOpenChatGPT(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      copyTextFallback(text);
    }
  }catch(e){
    copyTextFallback(text);
  }
  window.open('https://chatgpt.com/','_blank');
  alert('✅ 我已幫你整理並複製檢查內容。ChatGPT 已開啟，貼上後送出即可。');
}

async function translateToZhTW(text){
  const url='https://api.mymemory.translated.net/get?q='
    +encodeURIComponent(text)
    +'&langpair=en|zh-TW';

  const r=await fetch(url);

  if(!r.ok){
    throw new Error('translation_failed');
  }

  const data=await r.json();

  return (
    data?.responseData?.translatedText
    ||''
  ).trim();
}

function escapeHtml(s){
  return String(s??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

$('#lookupWord').onclick=async()=>{
  const word=$('#newEn').value.trim();

  if(!word){
    alert('請先輸入英文單字。');
    return;
  }

  $('#wordLookupStatus').textContent='🔎 查詢中…';
  $('#wordLookupResults').innerHTML='';

  try{
    const r=await fetch(
      'https://api.dictionaryapi.dev/api/v2/entries/en/'
      +encodeURIComponent(word)
    );

    if(!r.ok){
      throw new Error('not_found');
    }

    const data=await r.json();

    const meanings=[];

    for(const entry of data){
      for(const meaning of (entry.meanings||[])){
        const pos=meaning.partOfSpeech||'';
        for(const def of (meaning.definitions||[]).slice(0,3)){
          if(def.definition){
            meanings.push({
              pos,
              definition:def.definition,
              example:def.example||''
            });
          }
        }
      }
    }

    if(!meanings.length){
      throw new Error('not_found');
    }

    const unique=[];
    const seen=new Set();

    for(const m of meanings){
      const key=m.pos+'|'+m.definition;
      if(!seen.has(key)){
        seen.add(key);
        unique.push(m);
      }
      if(unique.length>=8)break;
    }

    const translated=[];

    for(const m of unique){
      let zh='';

      try{
        zh=await translateToZhTW(m.definition);
      }catch(e){
        zh='';
      }

      translated.push({...m,zh});
    }

    const grouped={};

    translated.forEach((m,idx)=>{
      const p=m.pos||'other';
      if(!grouped[p])grouped[p]=[];
      grouped[p].push({...m,idx});
    });

    $('#wordLookupResults').innerHTML=
      Object.entries(grouped).map(([pos,items])=>`
        <div class="lookup-card">
          <h4>${escapeHtml(posMap[pos]||pos)}</h4>
          ${items.map(item=>`
            <label class="lookup-row">
              <input type="checkbox"
                     class="lookup-choice"
                     data-pos="${escapeHtml(posMap[pos]||pos)}"
                     data-zh="${escapeHtml(item.zh||item.definition)}"
                     data-en="${escapeHtml(item.definition)}"
                     data-example="${escapeHtml(item.example||'')}">
              <span class="lookup-meaning">
                <b>${escapeHtml(item.zh||'暫時無中文翻譯')}</b>
                <div class="lookup-en">${escapeHtml(item.definition)}</div>
                ${item.example?`<div class="lookup-en">例：${escapeHtml(item.example)}</div>`:''}
              </span>
            </label>
          `).join('')}
        </div>
      `).join('')+
      `<div class="form-actions">
         <button id="applyLookup" type="button">✅ 套用勾選內容</button>
       </div>`;

    $('#wordLookupStatus').textContent=
      '✅ 查到了。請勾選你要保留的意思，再按「套用勾選內容」。';

    $('#applyLookup').onclick=()=>{
      const checked=[
        ...document.querySelectorAll('.lookup-choice:checked')
      ];

      if(!checked.length){
        alert('請先勾選至少一個意思。');
        return;
      }

      const posValues=[...new Set(
        checked.map(x=>x.dataset.pos).filter(Boolean)
      )];

      const zhValues=[...new Set(
        checked.map(x=>x.dataset.zh).filter(Boolean)
      )];

      const extras=checked.map(x=>{
        const bits=[];
        if(x.dataset.en)bits.push(x.dataset.en);
        if(x.dataset.example)bits.push('例：'+x.dataset.example);
        return bits.join('；');
      }).filter(Boolean);

      $('#newPos').value=posValues.join('／');
      $('#newZh').value=zhValues.join('；');
      $('#newExtra').value=extras.join('\n');

      $('#wordLookupStatus').textContent=
        '✅ 已套用到詞性、中文意思和補充欄位。建議儲存前再按「🤖 給 ChatGPT 檢查」做最後確認。';
    };

  }catch(err){
    $('#wordLookupStatus').textContent=
      '❌ 查不到這個單字，或免費字典服務暫時無法使用。你仍可以手動輸入。';
  }
};

function findGrammarEntry(q){
  const key=q.toLowerCase().trim();
  return grammarLibrary.find(g=>
    g.keys.some(k=>key.includes(k.toLowerCase()) || k.toLowerCase().includes(key))
  );
}

  const prompt=`請幫我檢查這份英文文法筆記是否正確，若有錯請直接改正，並用適合英文初學者的方式說明：
1. 文法名稱是否正確
2. 中文解釋是否正確
3. 公式是否正確
4. 例句文法是否正確、是否自然
5. 若有容易混淆的地方請提醒我

文法標題：${title}
中文解釋：${body}
公式：${formula}
例句：${example}`;

  copyAndOpenChatGPT(prompt);
};


function editWord(i){
  const w=words[i];
  if(!w)return;

  const en=prompt('英文',w.en);
  if(en===null)return;

  const pos=prompt('詞性',w.pos||'');
  if(pos===null)return;

  const zh=prompt('中文意思',w.zh||'');
  if(zh===null)return;

  const extra=prompt('補充／其他意思',w.extra||'');
  if(extra===null)return;

  const cleanEn=en.trim();
  const cleanZh=zh.trim();

  if(!cleanEn || !cleanZh){
    alert('英文和中文意思不能空白。');
    return;
  }

  if(words.some((x,idx)=>idx!==i && x.en.toLowerCase()===cleanEn.toLowerCase())){
    alert('這個單字已經存在。');
    return;
  }

  words[i]={
    en:cleanEn,
    pos:pos.trim(),
    zh:cleanZh,
    extra:extra.trim()
  };

  saveAllData();
  render();
  alert('✅ 單字已更新！');
}

function deleteWord(i){
  const w=words[i];
  if(!w)return;

  if(!confirm(`確定要刪除「${w.en}」嗎？`))return;

  words.splice(i,1);

  state.known=new Set([...state.known].filter(x=>x!==i).map(x=>x>i?x-1:x));
  state.fav=new Set([...state.fav].filter(x=>x!==i).map(x=>x>i?x-1:x));

  save();
  saveAllData();
  render();
}

function editGrammar(i){
  const g=grammar[i];
  if(!g)return;

  const title=prompt('文法標題',g.title||'');
  if(title===null)return;

  const body=prompt('中文解釋',g.body||'');
  if(body===null)return;

  const formula=prompt('公式',g.formula||'');
  if(formula===null)return;

  const example=prompt('例句',g.example||'');
  if(example===null)return;

  const cleanTitle=title.trim();

  if(!cleanTitle){
    alert('文法標題不能空白。');
    return;
  }

  if(grammar.some((x,idx)=>idx!==i && x.title===cleanTitle)){
    alert('這個文法標題已經存在。');
    return;
  }

  grammar[i]={
    title:cleanTitle,
    tags:Array.isArray(g.tags)?g.tags:['自訂'],
    body:body.trim(),
    formula:formula.trim(),
    example:example.trim()
  };

  saveAllData();
  render();
  alert('✅ 文法已更新！');
}

function deleteGrammar(i){
  const g=grammar[i];
  if(!g)return;

  if(!confirm(`確定要刪除「${g.title}」嗎？`))return;

  grammar.splice(i,1);
  saveAllData();
  render();
}

$('#importBtn').onclick=()=>$('#importFile').click();

$('#importFile').onchange=async e=>{
  const file=e.target.files?.[0];
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    const newWords=Array.isArray(data.words)?data.words:[];
    const newGrammar=Array.isArray(data.grammar)?data.grammar:[];
    let addedW=0, addedG=0;

    for(const w of newWords){
      if(w && w.en && !words.some(x=>x.en.toLowerCase()===String(w.en).toLowerCase())){
        words.push({
          en:String(w.en),
          pos:String(w.pos||''),
          zh:String(w.zh||''),
          extra:String(w.extra||'')
        });
        addedW++;
      }
    }

    for(const g of newGrammar){
      if(g && g.title && !grammar.some(x=>x.title===String(g.title))){
        grammar.push({
          title:String(g.title),
          tags:Array.isArray(g.tags)?g.tags.map(String):[],
          body:String(g.body||''),
          formula:String(g.formula||''),
          example:String(g.example||'')
        });
        addedG++;
      }
    }

    saveCustomData();
    render();
    alert(`匯入完成！新增 ${addedW} 個單字、${addedG} 個文法重點。`);
  }catch(err){
    alert('匯入失敗：檔案格式不正確。');
  }finally{
    e.target.value='';
  }
};

$('#exportBtn').onclick=()=>{
  const data={
    exportedAt:new Date().toISOString(),
    words:words,
    grammar:grammar
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='english-app-backup.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};


render();
</script>
